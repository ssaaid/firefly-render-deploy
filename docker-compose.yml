version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: firefly
      POSTGRES_PASSWORD: firefly
      POSTGRES_DB: firefly
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  ipfs:
    build: ./services/ipfs
    volumes:
      - ipfs-data:/data/ipfs
    ports:
      - "5001:5001"
      - "8080:8080"

  evmconnect:
    build: ./services/evmconnect
    environment:
      BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL:-http://host.docker.internal:8545}
    volumes:
      - evmconnect-data:/data/evmconnect
    ports:
      - "5008:5008"

  dataexchange:
    build: ./services/dataexchange
    environment:
      DATAEXCHANGE_PUBLIC_HOST: ${DATAEXCHANGE_PUBLIC_HOST:-localhost}
    volumes:
      - dataexchange-data:/data/dataexchange
    ports:
      - "3000:3000"
      - "3001:3001"

  firefly-core:
    build: ./services/core
    depends_on:
      - postgres
      - ipfs
      - evmconnect
      - dataexchange
    environment:
      FIREFLY_NAMESPACE: ${FIREFLY_NAMESPACE:-default}
      FIREFLY_ORG_NAME: ${FIREFLY_ORG_NAME:-org1}
      FIREFLY_NODE_NAME: ${FIREFLY_NODE_NAME:-node1}
      DATABASE_URL: postgres://firefly:firefly@postgres:5432/firefly?sslmode=disable
      EVMCONNECT_HOST: evmconnect
      DATAEXCHANGE_HOST: dataexchange
      IPFS_HOST: ipfs
    ports:
      - "5000:5000"
      - "5101:5001" # admin API; host 5001 is already taken by the ipfs API above

volumes:
  postgres-data:
  ipfs-data:
  evmconnect-data:
  dataexchange-data:
