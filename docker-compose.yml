services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: firefly
      POSTGRES_PASSWORD: firefly
      POSTGRES_DB: firefly
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  ipfs:
    build: ./services/ipfs
    volumes:
      - ipfs-data:/data/ipfs
    ports:
      - "5001:5001"
      - "8080:8080"

  besu:
    build: ./services/besu
    environment:
      BESU_VALIDATOR_KEY: ${BESU_VALIDATOR_KEY:?set BESU_VALIDATOR_KEY in .env, see README}
    volumes:
      - besu-data:/data/besu
    ports:
      - "8546:8545" # remapped on the host to avoid clashing with besu-ibft2-private-blockchain's node-1

  signer:
    build: ./services/signer
    depends_on:
      - besu
    environment:
      BESU_HOST: besu
      SIGNER_KEY: ${SIGNER_KEY:?set SIGNER_KEY in .env, see README}
    volumes:
      - signer-data:/data/signer
    ports:
      - "8555:8545"

  evmconnect:
    build: ./services/evmconnect
    depends_on:
      - besu
      - signer
    environment:
      SIGNER_HOST: signer
    volumes:
      - evmconnect-data:/data/evmconnect
    ports:
      - "5008:5008"

  dataexchange:
    build: ./services/dataexchange
    environment:
      DATAEXCHANGE_PUBLIC_HOST: ${DATAEXCHANGE_PUBLIC_HOST:-localhost}
      FIREFLY_ORG_NAME: ${FIREFLY_ORG_NAME:-org1}
      FIREFLY_NODE_NAME: ${FIREFLY_NODE_NAME:-node1}
    volumes:
      - dataexchange-data:/data/dataexchange
    ports:
      - "3000:3000"
      - "3001:3001"

  firefly-core:
    build: ./services/core
    depends_on:
      - postgres
      - ipfs
      - evmconnect
      - dataexchange
    environment:
      # Do NOT name any of these FIREFLY_ORG_* / FIREFLY_NODE_* / FIREFLY_*:
      # FireFly's own viper config auto-binds env vars FIREFLY_<SECTION>_<KEY>
      # to config keys regardless of what's in core.yml, so e.g. FIREFLY_ORG_NAME
      # gets read as the deprecated top-level org.name and silently reintroduces
      # the old validation path. Stick to unprefixed names for our own substitution.
      FIREFLY_NAMESPACE: ${FIREFLY_NAMESPACE:-default}
      CORE_ORG_NAME: ${FIREFLY_ORG_NAME:-org1}
      CORE_NODE_NAME: ${FIREFLY_NODE_NAME:-node1}
      ORG_SIGNING_KEY: ${ORG_SIGNING_KEY:?set ORG_SIGNING_KEY in .env, see README}
      BATCHPIN_CONTRACT_ADDRESS: ${BATCHPIN_CONTRACT_ADDRESS:?set BATCHPIN_CONTRACT_ADDRESS in .env, see README}
      DATABASE_URL: postgres://firefly:firefly@postgres:5432/firefly?sslmode=disable
      EVMCONNECT_HOST: evmconnect
      DATAEXCHANGE_HOST: dataexchange
      IPFS_HOST: ipfs
    ports:
      - "5050:5000" # host 5000 is often taken (e.g. macOS AirPlay Receiver)

volumes:
  postgres-data:
  besu-data:
  signer-data:
  ipfs-data:
  evmconnect-data:
  dataexchange-data:
