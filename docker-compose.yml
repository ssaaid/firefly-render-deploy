services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: firefly
      POSTGRES_PASSWORD: firefly
      POSTGRES_DB: firefly
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  ipfs:
    build: ./services/ipfs
    volumes:
      - ipfs-data:/data/ipfs
    ports:
      - "5001:5001"
      - "8080:8080"

  besu:
    build: ./services/besu
    environment:
      BESU_VALIDATOR_KEY: ${BESU_VALIDATOR_KEY:?set BESU_VALIDATOR_KEY in .env, see README}
    volumes:
      - besu-data:/data/besu
    ports:
      - "8546:8545" # remapped on the host to avoid clashing with besu-ibft2-private-blockchain's node-1

  evmconnect:
    build: ./services/evmconnect
    depends_on:
      - besu
    environment:
      BESU_HOST: besu
    volumes:
      - evmconnect-data:/data/evmconnect
    ports:
      - "5008:5008"

  dataexchange:
    build: ./services/dataexchange
    environment:
      DATAEXCHANGE_PUBLIC_HOST: ${DATAEXCHANGE_PUBLIC_HOST:-localhost}
      FIREFLY_ORG_NAME: ${FIREFLY_ORG_NAME:-org1}
      FIREFLY_NODE_NAME: ${FIREFLY_NODE_NAME:-node1}
    volumes:
      - dataexchange-data:/data/dataexchange
    ports:
      - "3000:3000"
      - "3001:3001"

  firefly-core:
    build: ./services/core
    depends_on:
      - postgres
      - ipfs
      - evmconnect
      - dataexchange
    environment:
      # Do NOT add FIREFLY_ORG_NAME/FIREFLY_NODE_NAME here: FireFly's own viper
      # config binds env vars FIREFLY_<SECTION>_<KEY> to config keys, so those
      # exact names get read as the deprecated top-level org.name/node.name
      # config and silently force multiparty mode regardless of core.yml.
      FIREFLY_NAMESPACE: ${FIREFLY_NAMESPACE:-default}
      DATABASE_URL: postgres://firefly:firefly@postgres:5432/firefly?sslmode=disable
      EVMCONNECT_HOST: evmconnect
      DATAEXCHANGE_HOST: dataexchange
      IPFS_HOST: ipfs
    ports:
      - "5050:5000" # host 5000 is often taken (e.g. macOS AirPlay Receiver)

volumes:
  postgres-data:
  besu-data:
  ipfs-data:
  evmconnect-data:
  dataexchange-data:
