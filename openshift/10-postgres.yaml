apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: firefly-postgres-data
  namespace: firefly
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
  # storageClassName omitted -- uses the cluster's default. Set explicitly if
  # your platform team requires a specific one (e.g. "ibmc-vpc-block-10iops-tier").
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly-postgres
  namespace: firefly
spec:
  replicas: 1
  strategy:
    type: Recreate # single ReadWriteOnce volume -- can't roll a second pod up alongside the old one
  selector:
    matchLabels:
      app: firefly-postgres
  template:
    metadata:
      labels:
        app: firefly-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: firefly
            - name: POSTGRES_DB
              value: firefly
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firefly-postgres-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata # avoid writing directly into the mount's lost+found root dir
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: firefly-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: firefly-postgres
  namespace: firefly
spec:
  selector:
    app: firefly-postgres
  ports:
    - port: 5432
      targetPort: 5432
