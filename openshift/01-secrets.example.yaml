# Copy this file to 01-secrets.yaml (gitignored) and fill in real values before
# applying. NEVER commit a copy with real values -- same discipline as .env
# locally and the sync:false dashboard vars on Render. See the main README's
# "Connecting to Besu" / "Multiparty mode" sections for where each value comes
# from -- the generation steps are identical, only the destination (a Secret
# here instead of a Render env var) differs.
apiVersion: v1
kind: Secret
metadata:
  name: firefly-besu-secret
  namespace: firefly
type: Opaque
stringData:
  BESU_VALIDATOR_KEY: "0x..." # must match services/besu/genesis.json's extraData
---
apiVersion: v1
kind: Secret
metadata:
  name: firefly-besu2-secret
  namespace: firefly
type: Opaque
stringData:
  BESU_VALIDATOR_KEY: "0x..." # must match services/besu2/genesis.json's extraData -- a DIFFERENT key from above
---
apiVersion: v1
kind: Secret
metadata:
  name: firefly-signer-secret
  namespace: firefly
type: Opaque
stringData:
  SIGNER_KEY: "0x..." # raw private key for the org's signing identity -- any fresh key, unlike the two above
---
apiVersion: v1
kind: Secret
metadata:
  name: firefly-core-secret
  namespace: firefly
type: Opaque
stringData:
  # The address (not the key) printed by firefly-signer when it generates its
  # keystore from SIGNER_KEY above -- rsh into the signer pod and check its logs,
  # or GET its /eth_accounts via a port-forward, same as the Render Shell steps.
  ORG_SIGNING_KEY: "0x..."
  # Set after deploying the BatchPin contract through the signer -- see README.
  BATCHPIN_CONTRACT_ADDRESS: "0x..."
  # postgres://firefly:<password>@firefly-postgres:5432/firefly?sslmode=disable
  # -- matches whatever password you set in 10-postgres.yaml's Secret.
  DATABASE_URL: "postgres://firefly:firefly@firefly-postgres:5432/firefly?sslmode=disable"
---
apiVersion: v1
kind: Secret
metadata:
  name: firefly-postgres-secret
  namespace: firefly
type: Opaque
stringData:
  POSTGRES_PASSWORD: "firefly" # change this
