apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: firefly-evmconnect-data
  namespace: firefly
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly-evmconnect
  namespace: firefly
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: firefly-evmconnect
  template:
    metadata:
      labels:
        app: firefly-evmconnect
    spec:
      securityContext:
        fsGroup: 0 # see firefly-besu's comment in 11-besu.yaml
      containers:
        - name: evmconnect
          image: firefly-evmconnect:latest
          ports:
            - containerPort: 5008
          env:
            - name: SIGNER_HOST
              value: firefly-signer
          volumeMounts:
            - name: data
              mountPath: /data/evmconnect
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            tcpSocket: { port: 5008 }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: firefly-evmconnect-data
---
apiVersion: v1
kind: Service
metadata:
  name: firefly-evmconnect
  namespace: firefly
spec:
  selector:
    app: firefly-evmconnect
  ports:
    - port: 5008
      targetPort: 5008
