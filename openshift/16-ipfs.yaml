apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: firefly-ipfs-data
  namespace: firefly
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly-ipfs
  namespace: firefly
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: firefly-ipfs
  template:
    metadata:
      labels:
        app: firefly-ipfs
    spec:
      securityContext:
        fsGroup: 0 # unlike the others, ipfs/kubo's own image already runs as non-root by default, but harmless to keep
      containers:
        - name: ipfs
          image: firefly-ipfs:latest
          ports:
            - containerPort: 5001
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data/ipfs
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            tcpSocket: { port: 5001 }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: firefly-ipfs-data
---
apiVersion: v1
kind: Service
metadata:
  name: firefly-ipfs
  namespace: firefly
spec:
  selector:
    app: firefly-ipfs
  ports:
    - name: api
      port: 5001
      targetPort: 5001
    - name: gateway
      port: 8080
      targetPort: 8080
