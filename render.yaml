# Render Blueprint for a single-org Hyperledger FireFly supernode in
# multiparty mode, backed by a single-validator Besu IBFT2 chain.
#
# Topology:
#   firefly-core          (web)   public HTTP/UI API, talks to postgres + the services below
#   firefly-dataexchange  (web)   MUST be public: other orgs' nodes reach it directly over the internet
#   firefly-evmconnect    (pserv) private: talks to firefly-signer (never holds a key itself)
#   firefly-signer        (pserv) private: holds the org's signing key, signs for firefly-besu
#   firefly-ipfs          (pserv) private: only firefly-core talks to it
#   firefly-besu          (pserv) private: single IBFT2 validator, only firefly-signer talks to it
#
# After the first deploy, you must deploy the FireFly BatchPin contract
# yourself and set its address as BATCHPIN_CONTRACT_ADDRESS below -- see
# "Connecting to Besu" / "Multiparty mode" in the README for the exact steps
# (same ones used to verify this locally: a raw eth_sendTransaction through
# firefly-signer's exposed RPC, using the bytecode baked into the firefly-core
# image at /firefly/contracts/Firefly.json).
#
# Verify this file against Render's current Blueprint spec before deploying
# (https://render.com/docs/blueprint-spec) -- field names such as `fromService`
# properties can change between Render API versions.
#
# Each service's buildFilter scopes auto-deploy to its own directory -- without
# it, Render redeploys all 6 services on every push (even a README-only commit),
# which caused a real crash once: multiple services restarting simultaneously
# raced each other's private-network DNS and firefly-core hard-exited on a
# WebSocket connect failure to firefly-dataexchange before it came back up.
# Note Render always reprocesses this file itself on any change, regardless
# of buildFilter -- so editing render.yaml still redeploys everything once.

databases:
  - name: firefly-db
    plan: basic-256mb # legacy "starter" plan is no longer accepted for new Postgres instances
    databaseName: firefly
    user: firefly

services:
  - type: pserv
    name: firefly-besu
    runtime: docker
    dockerfilePath: ./services/besu/Dockerfile
    dockerContext: ./services/besu
    buildFilter:
      paths:
        - services/besu/**
    plan: starter
    disk:
      name: besu-data
      mountPath: /data/besu
      sizeGB: 5
    envVars:
      # The validator private key matching the address baked into
      # services/besu/genesis.json's extraData. Never commit this value --
      # set it only in the Render dashboard. See README for the generated key.
      - key: BESU_VALIDATOR_KEY
        sync: false

  - type: pserv
    name: firefly-signer
    runtime: docker
    dockerfilePath: ./services/signer/Dockerfile
    dockerContext: ./services/signer
    buildFilter:
      paths:
        - services/signer/**
    plan: starter
    disk:
      name: signer-data
      mountPath: /data/signer
      sizeGB: 1
    envVars:
      - key: BESU_HOST
        fromService:
          type: pserv
          name: firefly-besu
          property: host
      # Raw hex private key (0x...) for the org's signing identity. Generate
      # one, store it safely, set it here -- never commit it. See README.
      - key: SIGNER_KEY
        sync: false

  - type: pserv
    name: firefly-ipfs
    runtime: docker
    dockerfilePath: ./services/ipfs/Dockerfile
    dockerContext: ./services/ipfs
    buildFilter:
      paths:
        - services/ipfs/**
    plan: starter
    disk:
      name: ipfs-data
      mountPath: /data/ipfs
      sizeGB: 5

  - type: pserv
    name: firefly-evmconnect
    runtime: docker
    dockerfilePath: ./services/evmconnect/Dockerfile
    dockerContext: ./services/evmconnect
    buildFilter:
      paths:
        - services/evmconnect/**
    plan: starter
    disk:
      name: evmconnect-data
      mountPath: /data/evmconnect
      sizeGB: 1
    envVars:
      - key: SIGNER_HOST
        fromService:
          type: pserv
          name: firefly-signer
          property: host
      # Only needed if you point evmconnect at a different chain/signer setup
      # instead of the bundled firefly-signer above (SIGNER_HOST takes precedence).
      - key: BLOCKCHAIN_RPC_URL
        sync: false

  - type: web
    name: firefly-dataexchange
    runtime: docker
    dockerfilePath: ./services/dataexchange/Dockerfile
    dockerContext: ./services/dataexchange
    buildFilter:
      paths:
        - services/dataexchange/**
    plan: starter
    disk:
      name: dataexchange-data
      mountPath: /data/dataexchange
      sizeGB: 1
    envVars:
      # After the first deploy, set this to the service's onrender.com hostname
      # (or your custom domain) -- other orgs' dataexchange plugins dial this.
      - key: DATAEXCHANGE_PUBLIC_HOST
        sync: false
      - key: FIREFLY_ORG_NAME
        value: org1
      - key: FIREFLY_NODE_NAME
        value: node1

  - type: web
    name: firefly-core
    runtime: docker
    dockerfilePath: ./services/core/Dockerfile
    dockerContext: ./services/core
    buildFilter:
      paths:
        - services/core/**
    plan: starter
    envVars:
      # Do NOT name any of these FIREFLY_ORG_* / FIREFLY_NODE_*: FireFly's own
      # viper config auto-binds env vars FIREFLY_<SECTION>_<KEY> to config keys
      # regardless of what's in core.yml, so e.g. FIREFLY_ORG_NAME gets read as
      # the deprecated top-level org.name and reintroduces the old validation
      # path. Stick to unprefixed names (CORE_*, ORG_*) for our own substitution.
      - key: FIREFLY_NAMESPACE
        value: default
      - key: CORE_ORG_NAME
        value: org1
      - key: CORE_NODE_NAME
        value: node1
      - key: ORG_SIGNING_KEY
        # The address of the firefly-signer keystore account (printed when you
        # generate it -- see README). Must match SIGNER_KEY on firefly-signer.
        sync: false
      - key: BATCHPIN_CONTRACT_ADDRESS
        # Set after deploying the BatchPin contract -- see README.
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: firefly-db
          property: connectionString
      - key: EVMCONNECT_HOST
        fromService:
          type: pserv
          name: firefly-evmconnect
          property: host
      - key: DATAEXCHANGE_HOST
        fromService:
          type: web
          name: firefly-dataexchange
          property: host
      - key: IPFS_HOST
        fromService:
          type: pserv
          name: firefly-ipfs
          property: host
